# 공장 서버 한 대에 올리는 구성.
#
#   docker compose up -d --build     띄우기 (처음 한 번은 빌드에 몇 분)
#   docker compose logs -f app       기동 로그 — 인증·저장소 상태가 여기 찍힌다
#   docker compose down              내리기 (자료는 남는다)
#   docker compose down -v           자료까지 지우기 🔴
#
# 설정은 .env 파일에서 읽는다. `.env.example`를 복사해 쓰십시오.

services:
  db:
    # 🔴 TimescaleDB 이미지를 쓴다. 수집값(M8)을 하이퍼테이블로 두기 때문이다.
    #    PG 17.11 · TimescaleDB 2.29.2로 실측했다(docs/PROGRESS.md §4)
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aas}
      POSTGRES_USER: ${POSTGRES_USER:-aas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하십시오}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 앱이 DB보다 먼저 떠서 실패하지 않도록, 받을 준비가 될 때까지 기다린다
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aas} -d ${POSTGRES_DB:-aas}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # 기본은 밖으로 열지 않는다. 도구로 직접 붙어야 하면 아래를 켠다
    # ports: ['55432:5432']

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aas}
      # 비우면 누구나 파일을 읽고 지울 수 있다. 기동 로그가 알려 준다
      AAS_TOKEN: ${AAS_TOKEN:-}
      AAS_READONLY_TOKEN: ${AAS_READONLY_TOKEN:-}
      # 🔴 토큰을 비운 채로 **사내 여러 명이** 쓰려면 1이어야 한다.
      #    비워 두면 프로그램이 컨테이너 안에서만 문을 열어 아무도 못 들어온다.
      #    설치 꾸러미의 .env는 1로 나간다(사내 공용이 기본 쓰임새라서다)
      AAS_ALLOW_OPEN: ${AAS_ALLOW_OPEN:-}
      # 첫 관리자 선점 방지 — 비우면 기동 로그에 무작위 코드를 찍는다
      AAS_SETUP_CODE: ${AAS_SETUP_CODE:-}
      # 공개 체험 서버 — docs/배포_호스팅.md
      DEMO_MODE: ${DEMO_MODE:-}
      AAS_DEMO_LOGIN: ${AAS_DEMO_LOGIN:-}
      AAS_DEMO_PASSWORD: ${AAS_DEMO_PASSWORD:-}
      AAS_DEMO_RESET_MINUTES: ${AAS_DEMO_RESET_MINUTES:-}
      # private이면 저마다 자기가 올린 것만 본다. 비우면 팀 공용(기본)
      AAS_WORKSPACE: ${AAS_WORKSPACE:-}
      AAS_SIGNUP: ${AAS_SIGNUP:-}
      AAS_SIGNUP_ROLE: ${AAS_SIGNUP_ROLE:-}
      # 비우면 연락처를 받지 않는다 — 처리방침 선행 강제
      AAS_PRIVACY_URL: ${AAS_PRIVACY_URL:-}
      # 다른 주소의 웹 앱이 브라우저에서 부를 때만. 비우면 교차 출처를 막는다
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # 수집(M8)을 켤지. OPC UA 장비가 없으면 꺼 두는 편이 낫다
      COLLECT: ${COLLECT:-off}
      # 자동 수집 주기(초). 비우면 수동(「지금 수집」)만
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-}
      # 수집값 보존 기간(일). 0이면 영구 보관 — 배포는 디스크가 차지 않게 기본 180일
      COLLECT_RETENTION_DAYS: ${COLLECT_RETENTION_DAYS:-180}
      # 규정 충돌 ⑤ — 표준 템플릿(AID 등)의 semanticId를 지킬지 KOSMO를 따를지
      LINT_STANDARD_TERMS: ${LINT_STANDARD_TERMS:-kosmo-first}
      AASX_MAX_TOTAL_MB: ${AASX_MAX_TOTAL_MB:-}
      # 템플릿 폴더 — ./templates 에 둔 .aasx가 기동 때 올라간다(「다른 파일에서 가져오기」의 출처)
      AAS_TEMPLATES_DIR: /templates
      # OPC UA 노출(M6·M7) — 켜면 상위 앱(MES·SCADA)이 구독으로 값을 받아 간다.
      # 🔴 이 포트에는 인증이 없다. 켤 때만 아래 ports의 4840 줄도 함께 연다
      OPCUA_SERVER: ${OPCUA_SERVER:-off}
      OPCUA_PORT: ${OPCUA_PORT:-4840}
      OPCUA_REFRESH: ${OPCUA_REFRESH:-5}
      OPCUA_HOST: ${OPCUA_HOST:-}
    ports:
      - '${APP_PORT:-8080}:8080'
      # OPCUA_SERVER=on일 때만 의미가 있다. 꺼져 있으면 아무도 받지 않는 빈 포트다
      - '${OPCUA_PORT:-4840}:${OPCUA_PORT:-4840}'
    volumes:
      # IDTA 템플릿 등 출발점이 될 AASX를 이 폴더에 둔다. 없으면 빈 폴더로 뜬다
      - ./templates:/templates:ro
    restart: unless-stopped

volumes:
  pgdata:
