# Setup for a single factory server.
#
#   docker compose up -d --build     start (the first build takes a few minutes)
#   docker compose logs -f app       startup log — authentication and storage status are printed here
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop and delete data too (Important: irreversible)
#
# Settings are read from the .env file. Copy `.env.example` to create it.

services:
  db:
    # Important: uses the TimescaleDB image, because collected values (M8) are kept in a hypertable.
    #    Measured with PG 17.11 · TimescaleDB 2.29.2 (docs/PROGRESS.md §4)
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aas}
      POSTGRES_USER: ${POSTGRES_USER:-aas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 정하십시오}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Wait until the DB accepts connections, so the app does not start before it and fail
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aas} -d ${POSTGRES_DB:-aas}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not exposed by default. Enable the line below if a tool needs to connect directly
    # ports: ['55432:5432']

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aas}
      # If empty, anyone can read and delete files. The startup log says so
      AAS_TOKEN: ${AAS_TOKEN:-}
      AAS_READONLY_TOKEN: ${AAS_READONLY_TOKEN:-}
      # Important: must be 1 to let **several people in the company** use it with no token set.
      #    If empty, the program only listens inside the container and nobody can get in.
      #    The install bundle's .env ships with 1 (shared in-house use is the default use case)
      AAS_ALLOW_OPEN: ${AAS_ALLOW_OPEN:-}
      # Prevents someone else claiming the first admin — if empty, a random code is printed in the startup log
      AAS_SETUP_CODE: ${AAS_SETUP_CODE:-}
      # Public demo server — docs/배포_호스팅.md
      DEMO_MODE: ${DEMO_MODE:-}
      AAS_DEMO_LOGIN: ${AAS_DEMO_LOGIN:-}
      AAS_DEMO_PASSWORD: ${AAS_DEMO_PASSWORD:-}
      AAS_DEMO_RESET_MINUTES: ${AAS_DEMO_RESET_MINUTES:-}
      # With private, each user sees only what they uploaded. Empty = shared by the team (default)
      AAS_WORKSPACE: ${AAS_WORKSPACE:-}
      AAS_SIGNUP: ${AAS_SIGNUP:-}
      AAS_SIGNUP_ROLE: ${AAS_SIGNUP_ROLE:-}
      AAS_LANG: ${AAS_LANG:-}
      # If empty, no contact details are collected — a privacy policy must come first
      AAS_PRIVACY_URL: ${AAS_PRIVACY_URL:-}
      # Only when a web app on another origin calls from the browser. Empty = cross-origin blocked
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Whether collection (M8) is on. Better off without OPC UA devices
      COLLECT: ${COLLECT:-off}
      # Automatic collection interval (seconds). Empty = manual ("Collect now") only
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-}
      # Retention for collected values (days). 0 = keep forever — deployments default to 180 days so the disk does not fill
      COLLECT_RETENTION_DAYS: ${COLLECT_RETENTION_DAYS:-180}
      # Rule conflict ⑤ — keep the semanticId of standard templates (AID etc.) or follow KOSMO
      LINT_STANDARD_TERMS: ${LINT_STANDARD_TERMS:-kosmo-first}
      AASX_MAX_TOTAL_MB: ${AASX_MAX_TOTAL_MB:-}
      # Template folder — .aasx files in ./templates are loaded at startup (the source for "Import from another file")
      AAS_TEMPLATES_DIR: /templates
      # OPC UA exposure (M6·M7) — when on, upper-level apps (MES, SCADA) receive values via subscriptions.
      # Important: this port has no authentication. Open the 4840 line under ports only when turning it on
      OPCUA_SERVER: ${OPCUA_SERVER:-off}
      OPCUA_PORT: ${OPCUA_PORT:-4840}
      OPCUA_REFRESH: ${OPCUA_REFRESH:-5}
      OPCUA_HOST: ${OPCUA_HOST:-}
    ports:
      - '${APP_PORT:-8080}:8080'
      # Only meaningful when OPCUA_SERVER=on. When off, it is an empty port nobody listens on
      - '${OPCUA_PORT:-4840}:${OPCUA_PORT:-4840}'
    volumes:
      # Put starting-point AASX files (IDTA templates etc.) in this folder. If missing, it starts with an empty folder
      - ./templates:/templates:ro
    restart: unless-stopped

volumes:
  pgdata:
