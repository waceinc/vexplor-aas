<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEXPLOR AAS Studio</title>
<meta name="description" content="AAS를 만들고 · 검사하고 · 내주고 · 현장 값까지 — 웹 화면 하나로. 체험 서버로 바로 이동합니다.">
<meta property="og:title" content="VEXPLOR AAS Studio">
<meta property="og:description" content="AASX 편집 · 검사 · 자동 고치기 · 표준 API · OPC UA 수집을 웹 화면 하나로">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f141a; color: #e3e8ee;
    font: 16px/1.7 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
  main { text-align: center; padding: 24px; max-width: 520px; }
  .brand { color: #4c9aff; font-weight: 800; letter-spacing: .14em; }
  h1 { font-size: 22px; margin: 6px 0 10px; }
  p { color: #97a3b0; margin: 0 0 18px; }
  a { color: #4c9aff; }
  .btn { display: inline-block; padding: 11px 20px; border-radius: 10px; background: #2f7cf6; color: #fff; font-weight: 700; text-decoration: none; margin: 4px; }
  .ghost { background: #161c24; border: 1px solid #283240; color: #e3e8ee; }
  .spin { width: 28px; height: 28px; border: 3px solid #283240; border-top-color: #4c9aff; border-radius: 50%; margin: 0 auto 16px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <div class="brand">VEXPLOR</div>
  <h1>AAS Studio</h1>
  <p id="msg">체험 서버로 이동하는 중입니다…</p>
  <div id="links" hidden>
    <a class="btn" id="go" href="intro/">체험 서버 열기</a>
    <a class="btn ghost" href="intro/">소개 보기</a>
  </div>
  <noscript><p><a href="intro/">소개 페이지로 가기</a></p></noscript>
</main>
<script>
  // 체험 서버 주소는 demo.json 하나에서 읽는다 — PC를 다시 켜면 주소가 바뀌고, 그때 자동으로 갱신된다
  (async () => {
    const fail = (text) => {
      document.getElementById('spin').hidden = true;
      document.getElementById('msg').textContent = text;
      document.getElementById('links').hidden = false;
    };
    try {
      const demo = await (await fetch('demo.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (!demo.url) throw new Error('no url');
      document.getElementById('go').href = demo.url;
      location.replace(demo.url);
      // 이동이 막히면(팝업 차단 등) 단추로 안내한다
      setTimeout(() => fail('자동으로 넘어가지 않으면 아래 단추를 눌러 주십시오.'), 4000);
    } catch {
      fail('체험 서버를 준비하는 중입니다. 잠시 뒤 다시 와 주십시오.');
    }
  })();
</script>
</body>
</html>
