# GitHub Actions — kept identical for after the open-source release. Locally: bash scripts/ci.sh
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    # 24 = active LTS (same version as the runtime image), 22 = minimum supported version (package.json engines) — both must pass
    strategy:
      matrix:
        node: [22, 24]
    # Actions are pinned to full commit SHAs (the tag is the comment) — a moved or hijacked tag cannot change what runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash scripts/ci.sh
