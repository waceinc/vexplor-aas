# GitHub Actions — kept identical for after the open-source release. Locally: bash scripts/ci.sh
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    # 24 = active LTS (same version as the runtime image), 22 = minimum supported version (package.json engines) — both must pass
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash scripts/ci.sh
